spring:
  application:
    name: zerosum

  # 애플리케이션 DataSource: app_rw (원장 UPDATE·DELETE 권한 없음, docs/07-ai-integration.md 권한 경계)
  datasource:
    url: jdbc:postgresql://localhost:5432/zerosum
    username: app_rw
    password: app_rw

  # Flyway 전용 계정: migrator (스키마 소유자). 애플리케이션은 이 계정을 쓰지 않는다
  flyway:
    url: jdbc:postgresql://localhost:5432/zerosum
    user: migrator
    password: migrator
    locations: filesystem:db/migration

  # 마스터 데이터(warehouse/location/sku/lot) 읽기 전용 조회에만 사용한다 (쓰기 경로는 JdbcClient)
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

# 실사 제출 허용 오차 (05-count-session.md). 코드에 기본값을 두지 않고 여기서만 주입한다.
# 출발값은 "차이 1개 이하이면서 5% 이하"(AND) — 재고 20개 미만 로케이션은 1개 차이도 REVIEW로 간다.
zerosum:
  count:
    tolerance:
      qty: 1
      pct: 0.05
  # 아웃박스 릴레이 (06-events-reconciliation.md). enabled=false면 스케줄러 빈 자체가 등록되지 않는다 —
  # 테스트는 이걸로 끄고 OutboxRelayService#relayOnce()를 직접 호출한다.
  outbox:
    relay:
      enabled: true
      interval-ms: 5000
  # 정합 검증 배치. 포트폴리오 규모에서는 전체 스캔으로 충분하다 (06-events-reconciliation.md).
  reconciliation:
    enabled: true
    interval-ms: 300000
  # AI 전용 커넥션 (docs/07-ai-integration.md 권한 경계). app_rw와 별도 계정·별도 풀을 쓴다.
  ai:
    # ai_ro: 조회 뷰(v_ledger·v_open_issue·v_count_history)만 읽는다.
    read:
      url: jdbc:postgresql://localhost:5432/zerosum
      username: ai_ro
      password: ai_ro
    # ai_proposer: 제안 INSERT와 inventory_issue.ai_analysis UPDATE만 할 수 있다.
    proposer:
      url: jdbc:postgresql://localhost:5432/zerosum
      username: ai_proposer
      password: ai_proposer
  # AI 제안(action_proposal) 관련 설정.
  proposal:
    # 제안의 유효 기간(분). 만료된 제안은 실행하지 않는다.
    ttl-minutes: 60
    basis:
      # basis_snapshot과 실제 재고의 허용 오차. 코드에 기본값을 두지 않는다 —
      # zerosum.count.tolerance와 같은 규칙으로, 운영 설정에서만 온다.
      tolerance-pct: 0.10
