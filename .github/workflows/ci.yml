# 이 저장소의 검증은 두 갈래다 — 둘 다 돌려야 회귀를 잡는다.
#   test    : Java 통합 테스트. Testcontainers가 자체 PostgreSQL 16 컨테이너를 띄운다
#   harness : db/run.sh. PL/pgSQL 레퍼런스 구현으로 스키마 자체를 검증한다
# 둘은 증명하는 것이 다르다. 하네스는 애플리케이션 코드 없이 DB 제약만으로 무엇이 막히는지를 보고,
# Java 테스트는 그 위에서 애플리케이션이 규칙을 지키는지를 본다. 그래서 둘을 별도 job으로 나눈다 —
# 어느 쪽이 깨졌는지가 곧 어느 계층이 깨졌는지다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다 (러너 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # :web의 processResources가 frontend/를 npm으로 빌드해 정적 리소스로 넣는다.
      # 러너에 node가 없으면 :web 빌드가 통째로 깨진다 — frontend/package-lock.json 기준으로 캐시한다.
      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Testcontainers가 컨테이너를 띄울 때 이미지 풀을 기다리지 않도록 미리 받아 둔다.
      - name: PostgreSQL 16 이미지 준비
        run: docker pull postgres:16

      # cleanTest로 캐시를 무시한다 — 빌드 캐시가 살아 있으면 test 태스크가 통째로 건너뛰어져
      # "통과"로 보이지만 실제로는 아무것도 돌지 않는다.
      - name: 테스트
        run: ./gradlew cleanTest test

      # Gradle의 test 태스크는 테스트가 0개여도 성공한다. 탐색이 깨지면 BUILD SUCCESSFUL인데
      # 아무것도 돌지 않은 상태가 초록불로 지나간다 — harness job의 grep 가드와 같은 이유로 막는다.
      # 하한을 특정 숫자로 고정하지는 않는다. 테스트가 늘 때마다 이 파일을 고쳐야 하고, 잡으려는 것은
      # "줄었다"가 아니라 "아무것도 돌지 않았다"이기 때문이다.
      - name: 테스트가 실제로 돌았는지 확인
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          # 멀티모듈 전환 후 결과가 core/build/... 아래로 내려갔고, 모듈이 더 늘어날 예정이므로
          # 모듈 디렉터리를 고정하지 않고 **로 재귀 탐색한다 (recursive=True 필수).
          total = sum(int(ET.parse(p).getroot().get('tests', 0))
                      for p in glob.glob('**/build/test-results/test/*.xml', recursive=True))
          print(f'실행된 테스트: {total}건')
          sys.exit(0 if total > 0 else '테스트가 한 건도 실행되지 않았다')
          PY

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test/'
          retention-days: 7

  harness:
    name: 스키마 하네스
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # db/run.sh는 컨테이너를 띄운 뒤 준비될 때까지 psql을 반복 시도한다. 이미지 풀이 그 대기
      # 시간에 섞이면 시도 횟수를 다 써버릴 수 있으므로 여기서 먼저 받아 둔다.
      - name: PostgreSQL 16 이미지 준비
        run: docker pull postgres:16

      # 마지막 줄이 "전체 N건 PASS" / "N건 FAIL"이다. FAIL이면 0이 아닌 종료 코드로 끝내야
      # job이 빨간불이 된다 — run.sh 자체는 FAIL을 세기만 하고 성공으로 끝나기 때문이다.
      - name: 유스케이스 실행
        run: |
          set -o pipefail
          bash db/run.sh | tee /tmp/harness.log
          grep -qE '^전체 [0-9]+건 PASS$' /tmp/harness.log
